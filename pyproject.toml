[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-hub-board"
dynamic = ["version"]
description = "A fast, read-only, Linear-style viewer for markdown issue hubs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mueed Qadri" }]
keywords = ["issues", "markdown", "kanban", "agents", "linear"]
classifiers = [
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Bug Tracking",
]

[project.urls]
Homepage = "https://github.com/mueedqadri/issue-hub-board"
Demo = "https://mueedqadri.github.io/issue-hub-board/"

[project.scripts]
issue-hub-board = "issue_hub_board.cli:main"

[tool.setuptools]
packages = ["issue_hub_board"]

[tool.setuptools.dynamic]
version = { attr = "issue_hub_board.__version__" }

[tool.setuptools.package-data]
issue_hub_board = ["ui.html", "viewer/*"]
